includes:
  - base.yml

dataset:
  - src: ../../data/property/train/data.lmdb
    target_mean: [0.0]
    target_std: [1.0]
  - src: ../../data/property/val/data.lmdb
  - src: ../../data/property/test/data.lmdb

model:
  name: property_model
  backbone:
    name: gemnet_t
    num_spherical: 7
    num_radial: 128
    num_blocks: 3
    emb_size_atom: 256
    emb_size_edge: 512
    emb_size_trip: 64
    emb_size_rbf: 16
    emb_size_cbf: 16
    emb_size_bil_trip: 64
    num_before_skip: 1
    num_after_skip: 2
    num_concat: 1
    num_atom: 3
    cutoff: 6.0
    max_neighbors: 50
    rbf:
      name: gaussian
    envelope:
      name: polynomial
      exponent: 5
    cbf:
      name: spherical_harmonics
    extensive: false
    otf_graph: false
    use_pbc: true
    activation: swish
  pooling:
    name: mean
  latent:
    hidden_dim: 256
    out_dim: 128
    num_layers: 2

task:
  primary_metric: target1_mae
  tasks:
    target1:
      type: regression
      loss: mae
      weight: 1.0

optim:
  batch_size: 8
  eval_batch_size: 16
  num_workers: 0
  lr_initial: 0.0003
  max_epochs: 100
  eval_every: 200
  param_groups:
    - name: backbone
      lr: 0.0001
    - name: latent
      lr: 0.0003
    - name: heads
      lr: 0.001
