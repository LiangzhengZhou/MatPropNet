includes:
  - base.yml

dataset:
  - src: ../../data/property/train/data.lmdb
    target_mean: [0.0, 0.0]
    target_std: [1.0, 1.0]
  - src: ../../data/property/val/data.lmdb
  - src: ../../data/property/test/data.lmdb

model:
  name: property_model
  backbone:
    name: dimenetplusplus
    hidden_dim: 128
    num_blocks: 4
    int_emb_size: 64
    basis_emb_size: 8
    out_emb_channels: 256
    num_spherical: 7
    num_radial: 6
    cutoff: 6.0
    envelope_exponent: 5
    num_before_skip: 1
    num_after_skip: 2
    num_output_layers: 3
    otf_graph: false
    use_pbc: true
  pooling:
    name: mean
  latent:
    hidden_dim: 256
    out_dim: 128
    num_layers: 2

task:
  primary_metric: target1_mae
  tasks:
    target1:
      type: regression
      loss: mae
      weight: 1.0
    target2:
      type: regression
      loss: mae
      weight: 1.0

optim:
  batch_size: 8
  eval_batch_size: 16
  num_workers: 0
  lr_initial: 0.0003
  max_epochs: 100
  eval_every: 200
  param_groups:
    - name: backbone
      lr: 0.0001
    - name: latent
      lr: 0.0003
    - name: heads
      lr: 0.001
