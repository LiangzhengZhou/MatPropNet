includes:
  - base.yml

dataset:
  - src: ../../data/property/train/data.lmdb
    target_mean: [0.0]
    target_std: [1.0]
  - src: ../../data/property/val/data.lmdb
  - src: ../../data/property/test/data.lmdb

model:
  name: property_model
  backbone:
    name: cgcnn
    hidden_dim: 128
    num_graph_conv_layers: 6
    embeddings: khot
    use_pbc: true
    cutoff: 6.0
    num_gaussians: 50
    otf_graph: false
  pooling:
    name: mean
  latent:
    hidden_dim: 256
    out_dim: 128
    num_layers: 2

task:
  primary_metric: target1_mae
  tasks:
    target1:
      type: regression
      loss: mae
      weight: 1.0

optim:
  batch_size: 16
  eval_batch_size: 32
  num_workers: 0
  lr_initial: 0.0005
  max_epochs: 100
  eval_every: 200
  param_groups:
    - name: backbone
      lr: 0.0003
    - name: latent
      lr: 0.0005
    - name: heads
      lr: 0.001
