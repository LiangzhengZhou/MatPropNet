[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matpropnet"
version = "0.2.0"
description = "General materials property prediction framework with reusable CLI entrypoints"
requires-python = ">=3.8"
dependencies = [
    "ase>=3.22",
    "lmdb>=1.4",
    "numpy>=1.23",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "sympy>=1.11",
    "torch>=2.0",
    "torch-geometric>=2.3",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
logging = [
    "tensorboard>=2.12",
    "wandb>=0.16",
]
materials = [
    "pymatgen>=2023.5",
]
visualization = [
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
]

[project.scripts]
matpropnet-preprocess = "matpropnet.cli.preprocess:main"
matpropnet-train = "matpropnet.cli.train:main"
matpropnet-eval = "matpropnet.cli.eval:main"
matpropnet-predict = "matpropnet.cli.predict:main"
matpropnet-embed-vis = "matpropnet.cli.embed_vis:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
